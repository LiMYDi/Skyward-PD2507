# Skyward for vivo iQOO Z10 Turbo+ (PD2507 / V2507A)
#
# PD2507 has no recovery partition: recovery is the RECOVERY fragment inside
# vendor_boot, and the stock ramdisk is LZ4-legacy packed.  tools/pd2507/build.py
# fetches that fragment out of vivo's full package and puts Skyward's ramdisk
# back into the same image, so nothing here needs a 9 GB download or a
# recovery partition.

[device]
codename = "PD2507"
brand = "vivo"
model = "iQOO Z10 Turbo+"
shown_model = "iQOO Z10 Turbo+"
ab = true
soc = { hans = "天玑9400+", hant = "天璣9400+", en = "Dimensity 9400+" }
os_version_prop = "ro.vivo.build.version.incremental"
authors = "移植：@Qingizi7 / @Moecho（PD2301）；PD2507 适配：LiMy"

# The panel is 1260x2800 at 560 dpi, the same shape the PD2301 port uses.
# Density is the stock software density; Skyward rescales by it alone.
[display]
width = 1260
height = 2800
density = 560
diagonal = 6.78

# Kernel modules live in vendor and vendor_dlkm on this platform.  The
# touchscreen driver is loaded by the stock recovery's own init, so nothing
# is forced here at first: bring-up starts with the stock set.
[modules]
sources = ["vendor", "vendor_dlkm"]
load = []

# Recovery's own view of the partitions it backs up.  MTK keeps the radio
# calibration in nvdata/nvcfg and the sensors' in persist; the secure
# partitions are left alone.
[backup]
efs = ["nvdata", "nvcfg", "persist", "proinfo"]
data_skipped = ["vendor/fingerprint", "vendor/faceunlock", "vendor/tzstorage", "vendor/qtee", "vendor/tui", "vendor/esehal"]

# vivo 在 data 分区里放日志与崩溃记录的目录（照 iQOO 11S 的 PD2304 配置搬来，
# 这台机器的同款目录在真机上确认存在）。清「日志」时只清里面的文件，保留目录。
[wipe]
logs = [
    "/data/bbklog",
    "/data/logData",
    "/data/logIface",
    "/data/vivodump",
    "/data/vendor/bbklog",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wifi",
]

# MTK 的 WLAN：驱动模块与高通那套完全不同。模块名取自全量包的 vendor_dlkm
# （kowlan_drv_gen4m_6991_6653 是 MT6991 + MT6653 这一版），conninfra 是它依赖
# 的通信基础设施，必须先加载。原厂的 init.recovery.wifi.rc 里写的是
# wlan_drv_gen4m_6985_6639，那是同系列另一颗芯片用的，不要照抄。
[wlan]
modules = ["conninfra", "kowlan_drv_gen4m_6991_6653"]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://wifi.vivo.com.cn/generate_204"

# 振动：驱动是 vivo 自己的 vivo_haptic_core.ko，节点挂在 LED 类下。真机确认
# /sys/class/leds/vibrator/ 有 duration 与 activate 两个文件，写时长再写 1 起振。
[haptics]
strength = { lightest = 0.4, strongest = 1.0 }
timed = { duration = "/sys/class/leds/vibrator/duration", activate = "/sys/class/leds/vibrator/activate", click = 40, ticks = 15 }

# vivo 的 vusb 默认只做设备端；写成 enabled，插 OTG 转接才会切到主机模式，
# 否则 U 盘永远枚举不出来（接电脑时仍是设备端，adb 正常）。真机确认节点存在。
[usb]
host_mode = { path = "/sys/devices/virtual/vusb/usb0/host_mode", value = "enabled" }
